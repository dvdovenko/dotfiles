name: nix checks

on:
  push:
    paths:
      - "nix/**"
      - "home/**"
      - ".chezmoiroot"
      - "scripts/**"
      - "Brewfile"
      - "Makefile"
      - ".github/workflows/nix-checks.yml"
  pull_request:
    paths:
      - "nix/**"
      - "home/**"
      - ".chezmoiroot"
      - "scripts/**"
      - "Brewfile"
      - "Makefile"
      - ".github/workflows/nix-checks.yml"

jobs:
  chezmoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-homebrew.sh
      - uses: DeterminateSystems/nix-installer-action@main
      - run: bash scripts/check-profiles.sh --nix
      - run: |
          target="$(mktemp -d)"
          nix shell --inputs-from ./nix nixpkgs#chezmoi -c chezmoi --source "$PWD" --destination "$target" apply
          test -f "$target/.zshenv"
          test -f "$target/.config/zsh/.zshrc"
          test -f "$target/.config/zsh/.zprofile"
          test -f "$target/.config/tmux/tmux.conf"
          test -f "$target/.config/starship.toml"

  linux:
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-linux]
        profile: [core, slim]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          suffix=''
          if [ '${{ matrix.profile }}' = slim ]; then suffix=-slim; fi
          nix build --impure "./nix#homeConfigurations.\"vps@${{ matrix.system }}$suffix\".activationPackage" --no-link
          nix shell --inputs-from ./nix nixpkgs#zsh nixpkgs#tmux nixpkgs#gitMinimal -c bash scripts/check-shell.sh

  darwin:
    strategy:
      matrix:
        target: [danylo-mbp, danylo-mbp-full]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --impure ./nix#darwinConfigurations.${{ matrix.target }}.system --no-link
