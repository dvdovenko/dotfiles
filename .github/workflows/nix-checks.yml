name: nix checks

on:
  push:
    paths:
      - "nix/**"
      - "home/**"
      - ".chezmoiroot"
      - "scripts/**"
      - "Brewfile"
      - "Makefile"
      - ".github/workflows/nix-checks.yml"
  pull_request:
    paths:
      - "nix/**"
      - "home/**"
      - ".chezmoiroot"
      - "scripts/**"
      - "Brewfile"
      - "Makefile"
      - ".github/workflows/nix-checks.yml"

jobs:
  chezmoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-homebrew.sh
      - run: bash scripts/check-profiles.sh
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          target="$(mktemp -d)"
          nix shell --inputs-from ./nix nixpkgs#chezmoi -c chezmoi --source "$PWD" --destination "$target" apply
          test -f "$target/.zshenv"
          test -f "$target/.config/zsh/.zshrc"
          test -f "$target/.config/zsh/.zprofile"
          test -f "$target/.config/tmux/tmux.conf"
          test -f "$target/.config/starship.toml"
          test -f "$target/.vimrc"

  linux:
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-linux]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          for system in x86_64-linux aarch64-linux; do
            nix eval --impure "./nix#homeConfigurations.\"vps@$system\".activationPackage.drvPath"
          done
          nix build --impure './nix#homeConfigurations."vps@${{ matrix.system }}".activationPackage' --no-link
          nix shell --inputs-from ./nix nixpkgs#zsh -c bash scripts/check-shell.sh

  darwin:
    strategy:
      matrix:
        target: [danylo-mbp, danylo-mbp-full]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --impure ./nix#darwinConfigurations.${{ matrix.target }}.system --no-link
